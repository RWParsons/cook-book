    --accent: #b5562f;
    --accent-ink: #ffffff;
    --protein: #b5562f;
    --carbs: #6f8f3e;
    --fat: #c99a2e;
    --warn-bg: #fff3e0;
    --warn-ink: #8a5a00;
    --danger-bg: #fdeaea;
    --danger-ink: #a3241f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --panel: #262019;
      --ink: #f1ebe3;
      --muted: #b3a698;
      --line: #3a3229;
      --accent: #e08a5f;
      --accent-ink: #1c1815;
      --protein: #e08a5f;
      --carbs: #9bc06a;
      --fat: #e0bb5f;
      --warn-bg: #3a2c12;
      --warn-ink: #f0c26b;
      --danger-bg: #3a1414;
      --danger-ink: #f28b85;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1815; --panel: #262019; --ink: #f1ebe3; --muted: #b3a698; --line: #3a3229;
    --accent: #e08a5f; --accent-ink: #1c1815; --protein: #e08a5f; --carbs: #9bc06a; --fat: #e0bb5f;
    --warn-bg: #3a2c12; --warn-ink: #f0c26b; --danger-bg: #3a1414; --danger-ink: #f28b85;
  }
  :root[data-theme="light"] {
    --bg: #faf7f2; --panel: #ffffff; --ink: #2b2420; --muted: #7a6f65; --line: #e8e0d6;
    --accent: #b5562f; --accent-ink: #ffffff; --protein: #b5562f; --carbs: #6f8f3e; --fat: #c99a2e;
    --warn-bg: #fff3e0; --warn-ink: #8a5a00; --danger-bg: #fdeaea; --danger-ink: #a3241f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  header.site-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 2px solid var(--line);
    padding-bottom: 14px;
  }
  header.site-header h1 {
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header.site-header .tagline {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .layout {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }
  nav.recipe-list {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    position: sticky;
    top: 20px;
  }
  nav.recipe-list h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 4px 6px 8px;
  }
  nav.recipe-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 9px 10px;
    margin-bottom: 2px;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.92rem;
    cursor: pointer;
  }
  nav.recipe-list button:hover { background: var(--bg); }
  nav.recipe-list button.active { background: var(--accent); color: var(--accent-ink); }
  nav.recipe-list button .tags {
    display: block;
    font-size: 0.72rem;
    opacity: 0.75;
    margin-top: 2px;
  }

  main.recipe { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 26px; min-width: 0; }
  main.recipe h2 { margin: 0 0 4px; font-size: 1.5rem; }
  .meta-row { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }
  .meta-row span:not(:last-child)::after { content: "·"; margin: 0 8px; }

  .serves-control {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .serves-control label { font-size: 0.85rem; color: var(--muted); }
  .serves-control .stepper { display: flex; align-items: center; gap: 6px; }
  .serves-control button {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: 1.1rem; cursor: pointer; font-family: inherit;
  }
  .serves-control input[type=number] {
    width: 56px; text-align: center; font-size: 1rem; padding: 5px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-family: inherit;
  }
  .serves-control .factor { font-size: 0.8rem; color: var(--muted); }

  .volume-note {
    font-size: 0.85rem;
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 18px;
    border: 1px solid var(--line);
  }
  .volume-note.ok { color: var(--muted); }
  .volume-note.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .volume-note.danger { background: var(--danger-bg); color: var(--danger-ink); border-color: transparent; }

  .macro-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; border: 1px solid var(--line); }
  .macro-bar div { height: 100%; }
  .macro-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.82rem; margin-bottom: 20px; color: var(--muted); }
  .macro-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .macro-legend b { color: var(--ink); }

  section h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 22px 0 10px; }
  ul.ingredients { list-style: none; margin: 0; padding: 0; }
  ul.ingredients li {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 0.95rem;
  }
  ul.ingredients li .qty { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  ul.ingredients li button.add-one {
    margin-left: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 6px; font-size: 0.72rem; padding: 2px 7px; cursor: pointer; font-family: inherit;
  }

  ol.method { padding-left: 1.3em; }
  ol.method li { margin-bottom: 10px; font-size: 0.95rem; }

  aside.shopping-list {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto;
  }
  aside.shopping-list h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; margin: 2px 0 12px; }
  aside.shopping-list .add-btn {
    width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 7px;
    padding: 10px; font-size: 0.9rem; cursor: pointer; margin-bottom: 14px; font-family: inherit;
  }
  aside.shopping-list .cat-group { margin-bottom: 14px; }
  aside.shopping-list .cat-group h4 { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; letter-spacing: 0.05em; }
  aside.shopping-list ul { list-style: none; margin: 0; padding: 0; }
  aside.shopping-list li { display: flex; align-items: flex-start; gap: 7px; font-size: 0.87rem; padding: 3px 0; }
  aside.shopping-list li.checked { opacity: 0.4; text-decoration: line-through; }
  aside.shopping-list li input { margin-top: 3px; }
  aside.shopping-list .list-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  aside.shopping-list .list-actions button {
    flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 6px; padding: 7px 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit;
  }
  aside.shopping-list .empty { color: var(--muted); font-size: 0.85rem; }
  aside.shopping-list .item-recipe { color: var(--muted); font-size: 0.72rem; display: block; }
</style>
</head>

  // Calories per serve — lets a serve be made bigger/smaller (more/less food
  // per meal) independently of how many serves are being cooked. Macro
  // percentages stay fixed (40/40/20-style); grams and ingredient quantities
  // scale with it.
  function getCalories(recipe) {
    const base = recipe.macros_per_serve.calories;
    const stored = localStorage.getItem(CALORIES_KEY_PREFIX + recipe.id);
    const n = stored ? parseFloat(stored) : base;
    return Number.isFinite(n) && n > 0 ? n : base;
  }

  function setCalories(recipe, n) {
    localStorage.setItem(CALORIES_KEY_PREFIX + recipe.id, String(n));
  }

  function scaledMacros(recipe, calories) {
    const base = recipe.macros_per_serve;
    const calorieFactor = calories / base.calories;
    return {
      calories: Math.round(calories),
      protein_g: Math.round(base.protein_g * calorieFactor),
      carbs_g: Math.round(base.carbs_g * calorieFactor),

      protein_pct: base.protein_pct,
      carbs_pct: base.carbs_pct,
      fat_pct: base.fat_pct
    };
  }

  // Round a scaled ingredient quantity sensibly.
  function scaleQty(ing, factor) {
    const raw = ing.base_qty * factor;
    if (ing.discrete) {
      return Math.ceil(raw - 1e-9);
    }
    if (raw < 10) {
      return Math.round(raw * 4) / 4; // nearest quarter for small qtys (tsp/tbsp/etc)
    }
    return Math.round(raw / 5) * 5; // nearest 5 for grams/ml
  }

  function loadList() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveList(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function renderNav() {
    const nav = document.getElementById("recipe-list");
    nav.innerHTML = "<h2>Recipes</h2>";
    RECIPES.forEach(r => {
      const btn = document.createElement("button");
      btn.className = r.id === currentId ? "active" : "";
      btn.innerHTML = r.name + '<span class="tags">' + (r.tags || []).join(" · ") + "</span>";
      btn.addEventListener("click", () => {
        currentId = r.id;
        renderNav();
        renderRecipe();
      });
      nav.appendChild(btn);
    });
  }

  function volumeNote(recipe, factor) {
    if (!recipe.estimated_volume_l) return "";
    const scaled = recipe.estimated_volume_l * factor;
    const max = recipe.max_fill_volume_l || 6;
    const safe = max * (2 / 3);
    let cls = "ok";
    let msg = "Estimated pot volume: " + scaled.toFixed(1) + "L of " + max + "L max fill.";
    if (scaled > max) {
      cls = "danger";
      msg += " This exceeds the Ninja Foodi's max fill line — cook in batches.";
    } else if (scaled > safe) {
      cls = "warn";
      msg += " Above the recommended 2/3 fill line (" + safe.toFixed(1) + "L) for foods that expand under pressure — consider batching.";
    }
    return '<div class="volume-note ' + cls + '">' + msg + "</div>";
  }

  function macroBar(macros) {
    const p = macros.protein_pct, c = macros.carbs_pct, f = macros.fat_pct;
    return (
      '<div class="macro-bar">' +
        '<div style="width:' + p + '%;background:var(--protein)"></div>' +
        '<div style="width:' + c + '%;background:var(--carbs)"></div>' +
        '<div style="width:' + f + '%;background:var(--fat)"></div>' +
      "</div>" +
      '<div class="macro-legend">' +
        '<span><span class="dot" style="background:var(--protein)"></span>Protein <b>' + macros.protein_g + "g (" + p + "%)</b></span>" +
        '<span><span class="dot" style="background:var(--carbs)"></span>Carbs <b>' + macros.carbs_g + "g (" + c + "%)</b></span>" +
        '<span><span class="dot" style="background:var(--fat)"></span>Fat <b>' + macros.fat_g + "g (" + f + "%)</b></span>" +
        "<span>" + macros.calories + " kcal / serve</span>" +
      "</div>"
    );
  }

  function renderRecipe() {
    const view = document.getElementById("recipe-view");
    const recipe = findRecipe(currentId);
    if (!recipe) {
      view.innerHTML = "<p>No recipes yet. Add one to data/recipes.json.</p>";
      return;
    }
    const serves = getServes(recipe);
    const servesFactor = serves / recipe.base_servings;
    const calories = getCalories(recipe);
    const calorieFactor = calories / recipe.macros_per_serve.calories;
    const totalFactor = servesFactor * calorieFactor;

    let html = "";
    html += "<h2>" + recipe.name + "</h2>";
    html += '<div class="meta-row">';
    html += "<span>Total time: " + (recipe.prep_time_min + recipe.cook_time_min) + " min</span>";
    html += "</div>";

    html += '<div class="serves-control">';
    html += "<label>Serves</label>";
    html += '<div class="stepper">';
    html += '<button data-action="dec">−</button>';
    html += '<input type="number" id="serves-input" min="1" value="' + serves + '">';
    html += '<button data-action="inc">+</button>';
    html += "</div>";
    html += '<span class="factor">(recipe written for ' + recipe.base_servings + ")</span>";
    html += "</div>";

    html += '<div class="serves-control">';
    html += "<label>Calories / serve</label>";
    html += '<div class="stepper">';
    html += '<button data-action="cal-dec">−</button>';
    html += '<input type="number" id="calories-input" min="1" step="10" value="' + Math.round(calories) + '">';
    html += '<button data-action="cal-inc">+</button>';
    html += "</div>";
    html += '<span class="factor">(recipe written for ' + recipe.macros_per_serve.calories + " kcal — bigger serves scale ingredients up too)</span>";
    html += "</div>";

    html += volumeNote(recipe, totalFactor);
    html += macroBar(scaledMacros(recipe, calories));

    html += "<section><h3>Ingredients</h3><ul class=\"ingredients\">";
    recipe.ingredients.forEach((ing, idx) => {
      const q = scaleQty(ing, totalFactor);
      html += "<li><span>" + ing.name + '</span><span class="qty">' + fmtQty(q) + " " + ing.unit + "</span></li>";
    });
    html += "</ul></section>";

    html += "<section><h3>Method</h3><ol class=\"method\">";
    recipe.method.forEach(step => { html += "<li>" + step + "</li>"; });
    html += "</ol></section>";

    view.innerHTML = html;

    document.getElementById("serves-input").addEventListener("change", (e) => {
      const n = Math.max(1, parseInt(e.target.value, 10) || recipe.base_servings);
      setServes(recipe, n);
      renderRecipe();
    });
    document.getElementById("calories-input").addEventListener("change", (e) => {
      const n = Math.max(1, parseFloat(e.target.value) || recipe.macros_per_serve.calories);
      setCalories(recipe, n);
      renderRecipe();
    });
    view.querySelectorAll(".stepper button").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        if (action === "inc" || action === "dec") {
          const cur = getServes(recipe);
          const next = action === "inc" ? cur + 1 : Math.max(1, cur - 1);
          setServes(recipe, next);
        } else if (action === "cal-inc" || action === "cal-dec") {
          const cur = getCalories(recipe);
          const next = action === "cal-inc" ? cur + 25 : Math.max(25, cur - 25);
          setCalories(recipe, next);
        }
        renderRecipe();
      });
    });
  }

  function renderShoppingList() {
    const items = loadList();
    const container = document.getElementById("shopping-list-content");
    if (!items.length) {
      container.innerHTML = '<p class="empty">Nothing on your list yet — pick a recipe, set serves, then add it.</p>';
      return;
    }
    const byCategory = {};
    items.forEach((item, idx) => {
      item._idx = idx;
      if (!byCategory[item.category]) byCategory[item.category] = [];
      byCategory[item.category].push(item);
    });
    let html = "";
    Object.keys(byCategory).sort().forEach(cat => {
      html += '<div class="cat-group"><h4>' + cat + "</h4><ul>";
      byCategory[cat].forEach(item => {
        html += '<li class="' + (item.checked ? "checked" : "") + '">';
        html += '<input type="checkbox" data-idx="' + item._idx + '" ' + (item.checked ? "checked" : "") + ">";
        html += "<span>" + item.product + " — " + item.qty + " " + item.unit +
          '<span class="item-recipe">for ' + item.recipe + "</span></span>";
        html += "</li>";
      });
      html += "</ul></div>";
    });
    container.innerHTML = html;
    container.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", () => {
        const items = loadList();
        items[parseInt(cb.dataset.idx, 10)].checked = cb.checked;
        saveList(items);
        renderShoppingList();
      });
    });
  }

  function addCurrentRecipeToList() {
    const recipe = findRecipe(currentId);
    if (!recipe) return;
    const serves = getServes(recipe);
    const servesFactor = serves / recipe.base_servings;
    const calories = getCalories(recipe);
    const calorieFactor = calories / recipe.macros_per_serve.calories;
    const totalFactor = servesFactor * calorieFactor;
    const items = loadList();
    recipe.ingredients.forEach(ing => {
      const q = scaleQty(ing, totalFactor);
      const existing = items.find(
        it => it.product === ing.product && it.unit === ing.unit && it.recipe === recipe.name
      );
      if (existing) {
        existing.qty = fmtQty(parseFloat(existing.qty) + q);
      } else {
        items.push({
          product: ing.product,
          category: ing.category,
          qty: fmtQty(q),
          unit: ing.unit,
          recipe: recipe.name,
          checked: false
        });
      }
    });
    saveList(items);
    renderShoppingList();
  }

  document.getElementById("add-to-list-btn").addEventListener("click", addCurrentRecipeToList);

  document.getElementById("clear-list-btn").addEventListener("click", () => {
    if (confirm("Clear the whole shopping list?")) {
      saveList([]);
      renderShoppingList();
    }
  });

  document.getElementById("copy-list-btn").addEventListener("click", () => {
    const items = loadList();
    if (!items.length) return;
    const byCategory = {};
    items.forEach(item => {
      if (!byCategory[item.category]) byCategory[item.category] = [];
      byCategory[item.category].push(item);
    });
    let text = "";
    Object.keys(byCategory).sort().forEach(cat => {
      text += cat + "\n";
      byCategory[cat].forEach(item => {
        text += "  [ ] " + item.product + " — " + item.qty + " " + item.unit + "\n";
      });
    });
    navigator.clipboard.writeText(text).then(() => {
      alert("Shopping list copied to clipboard.");
    }).catch(() => {
      alert(text);
    });
  });

  renderNav();
  renderRecipe();
  renderShoppingList();
})();
</script>
</body>
</html>
